# ==============================================================================
# FILE: .github/workflows/pytest.yml
# DESCRIPTION: GitHub Actions CI Pipeline for automated testing and code coverage.
# Triggers on push or pull request to ensure high code quality standards.
# ==============================================================================

name: CI Pipeline - Pytest & Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.11.9"
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Suite with Coverage Report
      run: |
        pytest --cov=app --cov-report=term-missing